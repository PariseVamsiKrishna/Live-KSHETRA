name: Live Kshetra CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Build Check ─────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client
        env:
          # Supabase env vars — set these in GitHub → Settings → Secrets → Actions
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-kshetra-dist
          path: client/dist
          retention-days: 7

# ─── Vercel deploys automatically via GitHub integration ────────────────────
# No extra deploy job needed — Vercel re-deploys on every push to main.
# If you want GitHub Actions to ALSO trigger Vercel, add these secrets:
#
#   VERCEL_TOKEN      → vercel.com → Account Settings → Tokens → Create
#   VERCEL_ORG_ID     → .vercel/project.json (run `vercel link` locally first)
#   VERCEL_PROJECT_ID → .vercel/project.json
